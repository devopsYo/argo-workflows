apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-workflows-cr
rules:
  - apiGroups:
      - argoproj.io
    resources: 
      - workflowtaskresults
    verbs:
      - create
      - patch
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - list
      - get
      - patch
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - list
      - get
      - watch